[project]
name = "dl-refresher"
version = "0.1.0"
description = "Lesson 2: a deep learning refresher with PyTorch, first with raw tensors and then with nn.Module"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",              # tensors, autograd and neural network layers
    "numpy>=2.0",              # used to make the two-spirals data
]

[dependency-groups]
dev = [
    "pytest>=8",               # test runner
]

[tool.uv]
package = false               # an application, not a library: run it from this folder

[tool.pytest.ini_options]
pythonpath = ["."]            # lets the tests import the dl_refresher package from this folder
testpaths = ["tests"]
